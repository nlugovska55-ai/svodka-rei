<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пульт РЭИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Пульт «Утро»: шапка со свежестью данных → вкладки Утро / Деньги / Все дела → боковая карточка дела.
   Один язык статусов: срочность «сегодня / неделя / фон», красный только у «горит» (не больше трёх на экране). */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#17201C; --muted:#5C6862; --faint:#828C87; --line:#DFE3DD;
  --accent:#2346B8; --accent-soft:#E6EBFA; --on-accent:#FFFFFF; --hot:#C9362A; --hot-soft:#FBE9E6; --warn:#A86504; --warn-soft:#FBF0DC;
  --ok:#1C7F50; --ok-soft:#E1F3E9; --wait:#5F6B66; --wait-soft:#ECEFED; --violet:#6B55C2;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.07);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#161B19; --sunk:#1B211F; --ink:#E6EBE8; --muted:#9AA6A0; --faint:#76827C; --line:#28302D;
  --accent:#88A2FF; --accent-soft:#1E2747; --on-accent:#0F1312; --hot:#FF6F5E; --hot-soft:#3A1C18; --warn:#F2AE45; --warn-soft:#382A12;
  --ok:#53C98F; --ok-soft:#14301F; --wait:#A3AEA8; --wait-soft:#222A27; --violet:#A895F5; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#161B19; --sunk:#1B211F; --ink:#E6EBE8; --muted:#9AA6A0; --faint:#76827C; --line:#28302D;
  --accent:#88A2FF; --accent-soft:#1E2747; --on-accent:#0F1312; --hot:#FF6F5E; --hot-soft:#3A1C18; --warn:#F2AE45; --warn-soft:#382A12;
  --ok:#53C98F; --ok-soft:#14301F; --wait:#A3AEA8; --wait-soft:#222A27; --violet:#A895F5; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
/* шапка */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:600}
.seal{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font:600 9px var(--f-disp)}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;border-radius:8px;padding:6px 14px;color:var(--muted);font-weight:500;display:flex;gap:7px;align-items:center}
.tab svg{width:16px;height:16px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fresh{margin-left:auto;font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:16px;height:16px}
/* утро */
.lead{display:grid;gap:14px;padding:6px 0 2px}
.lead h1{font:600 clamp(22px,3.2vw,30px)/1.25 var(--f-disp);letter-spacing:-.02em;max-width:30ch}
.lead h1 em{font-style:normal;color:var(--accent)}
.lead .day{color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13.5px;border-radius:8px}
.hint{font-size:12.5px;color:var(--faint)}
kbd{font:11px var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--faint);background:var(--surface)}
.sec{display:grid;gap:10px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh h2{font-size:15px;font-weight:600}
.sh .c{color:var(--faint);font-size:13px}
.link{margin-left:auto;font-size:13.5px;color:var(--accent);background:none;border:0;padding:0}
/* строки */
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:600}
.rw .under .l{color:var(--ok)} .rw .under .r{color:var(--warn)}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;background:var(--surface);transition:background .12s,transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;touch-action:pan-y}
.row:hover,.row.cur{background:var(--sunk)}
.row.cur{box-shadow:inset 2px 0 0 var(--accent)}
.row.out{opacity:0;transform:translateX(30px)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;transition:all .15s}
.chk:hover{border-color:var(--ok);background:var(--ok-soft)}
.chk svg{width:12px;height:12px;opacity:0;color:var(--ok)}
.chk:hover svg,.chk.on svg{opacity:1}
.chk.on{border-color:var(--ok);background:var(--ok-soft)}
.hotdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-right:7px;vertical-align:2px}
.main-txt{border:0;background:none;padding:0;text-align:left;min-width:0;display:grid;gap:1px}
.main-txt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main-txt .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-hot{background:var(--hot-soft);color:var(--hot)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-wait{background:var(--wait-soft);color:var(--wait)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.sync{font-size:11.5px;color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font:600 17px var(--f-disp)}
/* денежная полоса */
.strip{display:grid;gap:8px}
.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunk)}
.pipe span{display:block;min-width:4px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stg{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);text-align:left;display:grid;gap:1px}
.stg:hover{border-color:var(--faint)}
.stg[aria-pressed="true"]{border-color:var(--ink)}
.stg .k{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .v{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.stg .x{font-size:12px;color:var(--hot)}
/* корзины */
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;text-align:left;display:grid;gap:2px}
.bk:hover{border-color:var(--faint)}
.bk[aria-expanded="true"]{border-color:var(--ink)}
.bk .n{font:600 20px var(--f-disp);font-variant-numeric:tabular-nums}
.bk .k{font-weight:500}
.bk .s{font-size:13px;color:var(--muted)}
/* все дела */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);flex:1 1 240px;max-width:360px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grp{display:grid;gap:0}
.gh{display:flex;gap:10px;align-items:baseline;padding:11px 14px;background:var(--surface);border:0;border-top:1px solid var(--line);font-weight:600;width:100%;text-align:left;min-width:0}
.gh:hover{background:var(--sunk)}
.gh .car{color:var(--faint);width:10px;flex:none}
.gh .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gh:first-child{border-top:0}
.gh .c{color:var(--faint);font-weight:400;font-size:13px}
.gh .am{margin-left:auto}
.gh+.rw{border-top:0}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.av.l{background:var(--warn-soft);color:var(--warn)} .av.c{background:var(--wait-soft);color:var(--wait)} .av.k{background:var(--ok-soft);color:var(--ok)}
/* деньги */
.money-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.chart{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);position:relative}
.chart svg{width:100%;height:auto;display:block}
.big{font:600 26px/1.1 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13.5px}
.cap{font-size:12px;color:var(--faint);margin-top:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.projects{display:grid;gap:6px}
.pj{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--muted)}
.pj b{color:var(--ink);font-weight:500}
/* боковая карточка */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;transform:translateX(102%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 20px}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dh .cl{font-size:13px;color:var(--muted)}
.dh h3{font:600 18px/1.3 var(--f-disp);letter-spacing:-.01em;margin-top:2px}
.dbody{overflow:auto;display:grid;gap:14px;margin-top:14px;align-content:start;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fact{display:grid;gap:2px;font-size:14px}
.fact .k{font-size:12px;color:var(--faint)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13.5px}
.acts button:hover{border-color:var(--faint)}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ai{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ai textarea{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:76px;background:var(--bg);resize:vertical}
/* разбор утра */
.focus{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fcard{width:min(620px,100%);display:grid;gap:18px}
.fprog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.fprog .track{flex:1;height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fprog .track span{display:block;height:100%;background:var(--accent);transition:width .3s}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fbox .cl{color:var(--muted);font-size:14px}
.fbox h2{font:600 22px/1.3 var(--f-disp);letter-spacing:-.015em}
.fbox .d{color:var(--muted)}
.fbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbtns button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:2px;justify-items:center;font-weight:600;min-height:44px}
.fbtns button:hover{border-color:var(--faint)}
.fbtns button.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.fbtns kbd{background:transparent;color:inherit;opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);visibility:hidden;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:40;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;font-size:14px;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{background:none;border:0;color:var(--surface);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--muted)}
.skel{height:120px;border-radius:12px;background:var(--sunk)}
@media (max-width:820px){
  .stages,.buckets{grid-template-columns:repeat(2,minmax(0,1fr))}.money-grid{grid-template-columns:1fr}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 14px;min-height:44px}
  .tab[aria-selected="true"]{box-shadow:none;color:var(--accent)}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fresh{margin-left:0;order:3;width:100%}
  .bar .icon-btn{margin-left:auto}
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .row .am{display:none}
  .hint.desk,.foot .keys,.btn kbd,.fbtns kbd{display:none}
  .main-txt .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><span class="seal">РЭИ</span>Пульт</div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab" role="tab" data-tab="utro"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.4 1.4M12.6 12.6L14 14M4 14l1.4-1.4M12.6 5.4L14 4"/><circle cx="9" cy="9" r="3"/></svg>Утро</button>
      <button class="tab" role="tab" data-tab="money"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4.5" width="14" height="9" rx="2"/><circle cx="9" cy="9" r="2"/></svg>Деньги</button>
      <button class="tab" role="tab" data-tab="all"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 5h10M6 9h10M6 13h10"/><circle cx="2.5" cy="5" r=".6"/><circle cx="2.5" cy="9" r=".6"/><circle cx="2.5" cy="13" r=".6"/></svg>Все дела</button>
    </nav>
    <div class="fresh" id="fresh"><span class="dot" style="background:var(--faint)"></span>Загружаю данные…</div>
    <button class="icon-btn" id="theme" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6.5"/><path d="M9 2.5a6.5 6.5 0 000 13z" fill="currentColor"/></svg></button>
  </header>
  <main id="view"><div class="skel"></div></main>
  <footer class="foot"><span class="keys">Клавиши: <kbd>Ctrl K</kbd> или <kbd>/</kbd> поиск · <kbd>J</kbd> <kbd>K</kbd> по строкам · <kbd>E</kbd> сделано · <kbd>S</kbd> отложить · <kbd>A</kbd> передать Claude · <kbd>Esc</kbd> закрыть</span><a href="/old.html">Старый вид</a></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dt">
  <div class="dh"><div><div class="cl" id="dc"></div><h3 id="dt"></h3></div><button class="icon-btn" id="dx" aria-label="Закрыть"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="dbody" id="db"></div>
</aside>
<div class="focus" id="focus" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="tt"></span><button id="tu" type="button">Отменить</button></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
  const ico = {check: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5l3 3 7-7"/></svg>',
    search: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5"/><path d="M12 12l4 4"/></svg>'};

  // ---------- тема ----------
  const themes = ['auto', 'light', 'dark'];
  let theme = store.get('svodka-theme', 'auto');
  const applyTheme = () => { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; $('#theme').title = 'Тема: ' + ({auto: 'как в системе', light: 'светлая', dark: 'тёмная'})[theme]; };
  $('#theme').onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set('svodka-theme', theme); applyTheme(); };
  applyTheme();

  // ---------- данные ----------
  const MS = 864e5, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const parseRu = (s) => { if (!s) return null; let m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s); if (m) return new Date(+m[3], m[2] - 1, +m[1]); m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const days = (s) => { const d = parseRu(s); return d ? Math.round((d - today) / MS) : null; };
  const rub = (a) => !a ? '' : a >= 1e6 ? (a / 1e6).toFixed(2).replace('.', ',').replace(/,?0+$/, '') + ' млн ₽' : a >= 1e3 ? Math.round(a / 1e3) + ' тыс ₽' : Math.round(a) + ' ₽';
  const full = (a) => a ? Math.round(a).toLocaleString('ru-RU') + ' ₽' : '';
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const INTERNAL = new Set(['', 'Ольга', 'Бухгалтерия', 'Claude', 'Лена']);
  // Короткий заголовок: поле short из базы, иначе первая мысль из title без имени клиента
  const shorten = (t, client) => {
    let s = String(t || '').replace(/\s+/g, ' ').trim();
    const pre = s.indexOf(':'); if (pre > 1 && pre < 42) s = s.slice(pre + 1).trim();
    s = s.replace(/^[\d\s)\]:.,–-]+/, '');
    const cut = s.slice(16).search(/ — |; |\. | \(|: /); if (cut >= 0) s = s.slice(0, 16 + cut);
    if (s.length > 64) s = s.slice(0, 62).replace(/\s\S*$/, '') + '…';
    return cap(s) || cap(client);
  };
  let D = null, T = [];
  const pend = store.get('svodka-pending', {});  // отмеченное на сайте, пока не пришло в базу
  const outbox = store.get('svodka-outbox', []);
  function prep(d) {
    D = d; const upd = new Date(d.updated);
    for (const [id, p] of Object.entries(pend)) if (Date.now() - p.ts > 2 * MS) delete pend[id];
    T = (d.tasks || []).map((t) => {
      const dd = days(t.due), a = Number(t.amount) || 0, nx = t.next || '';
      const who = t.waiting || (t.wait ? (t.expert ? 'эксперт' : 'клиент') : (/^Ольг/.test(nx) || t.owner === 'Ольга') ? 'я' : t.mgr === 'Лена' ? 'Лена' : 'Claude');
      const hot = !!(t.prio || (dd !== null && dd < -3 && !t.wait) || (dd !== null && dd <= 0 && a >= 100000 && !t.wait));
      const urg = t.urgency || (t.wait ? 'фон' : (hot || (dd !== null && dd <= 0)) ? 'сегодня' : (dd !== null && dd <= 7) ? 'неделя' : 'фон');
      const internal = INTERNAL.has(t.client);
      return {...t, a, dd, who, hot, urg, short: t.short || shorten(t.title, t.client), cl: internal ? (who === 'я' ? 'Лично вам' : t.section) : t.client, internal};
    });
    // «Нужно от вас» из сводки «Утра» — тоже дела за Ольгой
    const norm = (x) => String(x || '').toLowerCase().replace(/[^a-zа-яё0-9]+/g, ' ').trim().slice(0, 28);
    const seen = new Set(T.map((t) => norm(shorten(t.title))));
    (d.summary || []).filter((s) => s.section === 'Нужно от вас').forEach((s, i) => {
      const txt = s.text || '', head = txt.split(/[:;(]| — /)[0].trim(), rest = txt.slice(head.length).replace(/^[:;,.\s—-]+/, '');
      // «ГЕА: вставить памятку…» — слева тема, действие после двоеточия: заголовок = действие, тема = клиент
      const isTopic = rest && head.split(/\s+/).length <= 3 && !/^(включить|загрузить|проверить|ответить|отправить|нажать|подписать|оплатить|вставить|продлевать)/i.test(head);
      const short = isTopic ? shorten(rest) : (head.length > 70 ? shorten(txt) : head);
      if (seen.has(norm(short)) || seen.has(norm(rest))) return;  // то же дело уже есть в базе задач
      seen.add(norm(short));
      T.push({id: 'sum-' + (s.id || i), title: txt, short, detail: isTopic ? rest : rest, next: '', cl: s.client || (isTopic ? head : 'Нужно от вас'), client: s.client || '', internal: !s.client && !isTopic,
        a: 0, dd: 0, who: 'я', hot: s.flag === 'срочно', urg: 'сегодня', section: 'Нужно от вас', fromSummary: true, link: s.link || '', mgr: 'Ольга', owner: 'Утро и задачи'});
    });
    // свежесть
    const hm = (x) => String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
    const slots = [[9, 30], [13, 0], [17, 0]]; let nextS = null;
    for (let k = 0; k < 7 && !nextS; k++) { const day = new Date(today.getTime() + k * MS); if (day.getDay() % 6 === 0) continue; for (const [h, m] of slots) { const s = new Date(day); s.setHours(h, m); if (s > now) { nextS = s; break; } } }
    const old = (now - upd) / 36e5;
    const same = upd.toDateString() === now.toDateString();
    $('#fresh').innerHTML = `<span class="dot" style="background:${old > 5 ? 'var(--warn)' : 'var(--ok)'}"></span>Обновлено ${same ? '' : upd.toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'}) + ' '}${hm(upd)}${nextS ? ' · следующее ' + (nextS.toDateString() === now.toDateString() ? '' : nextS.toLocaleDateString('ru-RU', {weekday: 'short'}) + ' ') + hm(nextS) : ''}`;
  }
  const isOpen = (t) => !(pend[t.id] && ['done', 'later', 'wait'].includes(pend[t.id].action));
  const order = (x, y) => (y.hot - x.hot) || ((x.dd ?? 99) - (y.dd ?? 99)) || (y.a - x.a);
  const mineAll = () => T.filter((t) => t.who === 'я' && isOpen(t)).sort((x, y) => (y.hot - x.hot) || (y.fromSummary ? 1 : 0) - (x.fromSummary ? 1 : 0) || order(x, y));
  const isToday = (t) => t.urg === 'сегодня' || (t.dd !== null && t.dd <= 0);
  const mine = () => mineAll().filter(isToday);

  // ---------- действия: сразу в ветку inbox, с отменой ----------
  const LABEL = {done: 'Сделано', later: 'Отложить до завтра', eve: 'На вечер', prio: 'Горит', wait: 'Ждём клиента', ai: 'Передано Claude'};
  let undo = null;
  function toast(msg, onUndo) {
    $('#tt').textContent = msg; $('#tu').hidden = !onUndo; undo = onUndo || null;
    $('#toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => { $('#toast').classList.remove('on'); undo = null; flush(); }, 5000);
  }
  $('#tu').onclick = () => { if (undo) undo(); undo = null; $('#toast').classList.remove('on'); };
  function act(t, action, text = '') {
    const item = {client: t.cl, taskId: t.fromSummary ? null : t.id, taskTitle: t.title.slice(0, 300), text, action: action === 'ai' ? '' : action, actionLabel: LABEL[action], at: new Date().toISOString(), qid: Math.random().toString(36).slice(2)};
    const prev = pend[t.id];
    if (action !== 'ai') pend[t.id] = {action, ts: Date.now()};
    outbox.push(item); store.set('svodka-pending', pend); store.set('svodka-outbox', outbox);
    render();
    toast(LABEL[action] + (action === 'ai' ? '' : ': ' + t.short), () => {
      const i = outbox.findIndex((x) => x.qid === item.qid); if (i >= 0) outbox.splice(i, 1);
      if (prev) pend[t.id] = prev; else delete pend[t.id];
      store.set('svodka-pending', pend); store.set('svodka-outbox', outbox); render();
    });
  }
  let sending = false;
  async function flush() {
    if (sending || !outbox.length) return; sending = true;
    const items = outbox.slice();
    try {
      const res = await fetch('/api/comments', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({items})});
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok) throw new Error(j.error || ('ответ ' + res.status));
      outbox.splice(0, items.length); store.set('svodka-outbox', outbox);
      toast('Отправлено в ветку inbox: ' + plural(items.length, 'отметка', 'отметки', 'отметок') + '. Claude внесёт на разборе (10, 13, 18 ч)');
    } catch (e) {
      $('#tt').textContent = 'Не дошло: ' + e.message + '. Отметки сохранены'; $('#tu').hidden = false; $('#tu').textContent = 'Повторить';
      undo = () => { $('#tu').textContent = 'Отменить'; flush(); }; $('#toast').classList.add('on'); clearTimeout(toast.t);
    } finally { sending = false; render(); }
  }

  // ---------- строки ----------
  const duePill = (t) => t.fromSummary ? ''
    : t.dd === null ? '' : t.dd < 0 ? `<span class="pill p-warn">просрочено ${-t.dd} дн</span>` : t.dd === 0 ? '<span class="hint">сегодня</span>'
    : t.dd === 1 ? '<span class="pill p-wait">завтра</span>' : `<span class="pill p-wait">${t.dd <= 7 ? 'через ' + t.dd + ' дн' : parseRu(t.due).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'})}</span>`;
  const av = (t) => t.who === 'я' ? '<span class="av" title="За вами">О</span>' : t.who === 'Лена' ? '<span class="av l" title="Ведёт Лена">Л</span>' : t.who === 'клиент' || t.who === 'эксперт' ? `<span class="av k" title="Ждём: ${t.who}">⋯</span>` : '<span class="av c" title="Ведёт Claude">C</span>';
  const syncTag = (t) => pend[t.id] ? `<span class="sync">${LABEL[pend[t.id].action].toLowerCase()} · ждёт синхронизации</span>` : '';
  const row = (t, opt = {}) => `<div class="rw" data-id="${esc(t.id)}"><div class="under"><span class="l">Сделано</span><span class="r">Отложить</span></div>
    <div class="row">${opt.check !== false ? `<button class="chk" data-act="done" aria-label="Сделано">${ico.check}</button>` : av(t)}
    <button class="main-txt" data-open><span class="t">${t.hot ? '<span class="hotdot" title="Горит"></span>' : ''}${esc(t.short)}</span><span class="s">${esc(opt.noClient ? (t.next || '').slice(0, 120) : t.fromSummary ? t.detail.slice(0, 140) : t.cl)}${syncTag(t) ? ' · ' : ''}${syncTag(t)}</span></button>
    ${duePill(t)}<span class="am">${t.a && !t.short.replace(/\s/g, '').includes(String(Math.round(t.a))) ? rub(t.a) : ''}</span></div></div>`;

  // ---------- вкладки ----------
  let tab = 'utro', q = '', who = 'all', sec = 'all', mf = '', openB = '';
  const openG = new Set();
  const STAGES = [['выставить счёт', 'Выставить счёт', 'var(--faint)'], ['ждём подпись', 'Ждём подпись', 'var(--warn)'], ['ждём', 'Ждём оплату', 'var(--accent)'], ['пришло', 'Пришло', 'var(--ok)']];
  const CHECK = ['проверяется', 'Проверяем источник', 'var(--violet)'];
  function money() {
    const o = T.filter(isOpen);
    return [...STAGES, CHECK].map(([k, l, c]) => { const a = o.filter((t) => t.money === k); return {k, l, c, n: a.length, s: a.reduce((x, t) => x + t.a, 0), late: a.filter((t) => t.dd !== null && t.dd < 0).reduce((x, t) => x + t.a, 0)}; });
  }
  const stripHTML = (all, clickTo) => { const g = all.filter((x) => x.k !== CHECK[0]), chk = all.find((x) => x.k === CHECK[0]), tot = g.reduce((x, y) => x + y.s, 0) || 1;
    return `<div class="strip"><div class="pipe">${g.filter((x) => x.s).map((x) => `<span style="flex:${x.s / tot};background:${x.c}" title="${x.l}: ${full(x.s)}"></span>`).join('')}</div>
    <div class="stages">${g.map((x) => `<button class="stg" data-mf="${x.k}" data-go="${clickTo}" aria-pressed="${tab === 'money' && mf === x.k}"><span class="k"><span class="dot" style="background:${x.c}"></span>${x.l} · ${x.n}</span><span class="v">${rub(x.s) || '—'}</span>${x.late ? `<span class="x">из них ${rub(x.late)} просрочено</span>` : ''}</button>`).join('')}</div>
    ${chk && chk.s ? `<button class="link" style="margin:0;justify-self:start;color:var(--muted)" data-mf="${CHECK[0]}" data-go="${clickTo}">Ещё ${rub(chk.s)} на проверке источника · ${plural(chk.n, 'дело', 'дела', 'дел')}</button>` : ''}</div>`; };

  function utro() {
    const m = mine(), shown = m.slice(0, 7), o = T.filter(isOpen), week = mineAll().filter((t) => !isToday(t));
    const g = money(), wait = g.find((x) => x.k === 'ждём'), late = g.reduce((x, y) => x + y.late, 0);
    const wc = o.filter((t) => t.who === 'клиент' || t.who === 'эксперт');

    return `<section class="lead"><div class="day">${cap(dn)}</div>
      <h1>${m.length ? `Сегодня за вами <em>${plural(m.length, 'дело', 'дела', 'дел')}</em>` : 'Утро разобрано'}. Ждём оплату ${rub(wait.s) || '0 ₽'}${late ? `, из них ${rub(late)} просрочено` : ''}.${wc.length ? ` ${plural(wc.length, 'дело ждёт', 'дела ждут', 'дел ждут')} клиента.` : ''}</h1>
      <div class="cta">${m.length ? `<button class="btn" data-focus>Разобрать утро <kbd style="background:transparent;color:inherit;border-color:currentColor;opacity:.7">R</kbd></button>` : ''}${m.length ? '<span class="hint desk">По одному делу на экране: сделано, отложить или передать Claude</span>' : ''}</div></section>
    <section class="sec"><div class="sh"><h2>За вами</h2><span class="c">сегодня и просроченное</span>${m.length > 7 ? '<button class="link" data-focus>Ещё ' + (m.length - 7) + ' в разборе</button>' : ''}</div>
      ${shown.length ? `<div class="rows">${shown.map((t) => row(t)).join('')}</div>` : `<div class="empty"><b>Утро разобрано</b><span>На сегодня за вами ничего. ${esc($('#fresh').textContent.replace(/^.*следующее/, 'Следующее обновление'))}</span></div>`}</section>
    <section class="sec"><div class="sh"><h2>Деньги</h2><button class="link" data-go="money">Подробно</button></div>${stripHTML(g, 'money')}</section>
    <section class="sec"><div class="sh"><h2>Остальное</h2><span class="c">свёрнуто, откройте нужное</span></div>
      <div class="buckets">${bucket('week', week.length, 'На неделе', week.length ? 'за вами, не сегодня' : 'пусто')}${bucket('wait', wc.length, 'Ждём клиента', oldest ? 'самое долгое ожидание ' + oldest + ' дн' : 'от нас ничего не нужно')}
      ${bucket('team', teamHot.length, 'Горит у команды', 'Лена и Claude ведут ' + plural(team.length, 'дело', 'дела', 'дел'))}
      ${bucket('proj', proj.length, 'Проекты', proj.filter((p) => p.flag === 'warn' || p.flag === 'срочно').length + ' ждут вашего шага')}</div>
      ${openB === 'proj' ? `<div class="rows" style="padding:12px 14px"><div class="projects">${proj.map((p) => `<div class="pj"><span class="dot" style="background:${p.flag === 'ok' ? 'var(--ok)' : 'var(--warn)'}"></span><span><b>${esc(p.text.split(':')[0])}</b>${esc(p.text.slice(p.text.split(':')[0].length))}</span></div>`).join('')}</div></div>` : ''}
      ${bl.length ? `<div class="rows">${bl.slice(0, 15).map((t) => row(t, {check: openB === 'week'})).join('')}</div>${bl.length > 15 ? `<button class="link" style="margin:0" data-go="all" data-who="${openB === 'wait' ? 'клиент' : 'team'}">Все ${bl.length}</button>` : ''}` : ''}
    </section>`;
  }

  function all() {
    let o = T.filter(isOpen);
    if (who === 'team') o = o.filter((t) => t.who === 'Лена' || t.who === 'Claude'); else if (who === 'клиент') o = o.filter((t) => t.who === 'клиент' || t.who === 'эксперт'); else if (who === 'eve') o = o.filter((t) => t.evening); else if (who !== 'all') o = o.filter((t) => t.who === who);
    if (sec !== 'all') o = o.filter((t) => t.section === sec);

    const by = new Map(); o.sort(order).forEach((t) => { if (!by.has(t.cl)) by.set(t.cl, []); by.get(t.cl).push(t); });
    const groups = [...by.entries()];

    const secs = ['all', 'Мои клиенты', 'Клиенты Лены', 'Бухгалтерия', 'Диадок', 'Прочее'];
    return `<section class="sec"><div class="tools"><label class="search">${ico.search}<input id="q" placeholder="Клиент, счёт, тема" value="${esc(q)}" aria-label="Поиск" autocomplete="off"><kbd>/</kbd></label>
      ${chips.map(([k, l]) => `<button class="chip" data-who="${k}" aria-pressed="${who === k}">${l}</button>`).join('')}</div>
      <div class="tools">${secs.map((s) => `<button class="chip" data-sec="${s}" aria-pressed="${sec === s}">${s === 'all' ? 'Все разделы' : s}</button>`).join('')}</div>
      <div class="sh"><h2>${plural(o.length, 'дело', 'дела', 'дел')}</h2><span class="c">${plural(groups.length, 'клиент', 'клиента', 'клиентов')} и направлений</span></div>
      ${groups.length ? `<div class="rows grp">${groups.map(([c, ts]) => { const op = q || who !== 'all' || sec !== 'all' || groups.length <= 3 || openG.has(c) || ts.some((t) => t.hot); return `<button class="gh" data-g="${esc(c)}" aria-expanded="${op}"><span class="car">${op ? '▾' : '▸'}</span>${esc(c)}<span class="c">${plural(ts.length, 'дело', 'дела', 'дел')}${!op ? ' · ' + esc(ts[0].short) : ''}</span><span class="am">${rub(ts.reduce((x, t) => x + t.a, 0))}</span></button>${op ? ts.map((t) => row(t, {noClient: true})).join('') : ''}`; }).join('')}</div>` : '<div class="empty"><b>Ничего не нашлось</b><span>Поменяйте фильтр или слово для поиска.</span></div>'}</section>`;
  }

  function moneyTab() {
    const g = money(), o = T.filter(isOpen);
    const list = o.filter((t) => t.a > 0 && (mf ? t.money === mf : true)).sort((x, y) => y.a - x.a).slice(0, 15);
    const adv = o.filter((t) => /аванс/i.test(t.title) && /без акт/i.test(t.title)), advS = adv.reduce((x, t) => x + t.a, 0);
    const P = D.prognoz;
    return `<section class="sec"><div class="sh"><h2>От счёта до поступления</h2><span class="c">нажмите на этап, чтобы отфильтровать</span></div>${stripHTML(g, '')}</section>
    <div class="money-grid"><section class="sec"><div class="sh"><h2>${mf ? [...STAGES, CHECK].find((s) => s[0] === mf)[1] : 'Крупные суммы'}</h2>${mf ? '<button class="link" data-mf="">Все этапы</button>' : ''}</div>
      ${list.length ? `<div class="rows">${list.map((t) => row(t, {check: false})).join('')}</div>` : '<div class="empty"><b>На этом этапе пусто</b></div>'}
      ${advS ? `<div class="sub">Получено авансом без актов: <b class="num">${full(advS)}</b> (${plural(adv.length, 'запись', 'записи', 'записей')}). Нужны акты, иначе это долг перед клиентом.</div>` : ''}</section>
      ${P && P.months ? `<section class="sec"><div class="sh"><h2>Продления по ФСА</h2><span class="c">ожидаемо за 6 мес.</span></div><div class="chart"><div class="big">${full(P.next6_expected)}</div><div class="sub">из возможных ${full(P.next6_potential)}</div>${chart(P.months.slice(0, 12))}<div class="tip" id="tip"></div><div class="cap">Тёмный столбец ожидаемо, светлый если продлят все. ${esc(P.source || '')}</div></div></section>` : ''}</div>`;
  }
  function chart(m) {
    const W = 440, H = 190, L = 34, B = 24, max = Math.max(...m.map((x) => x.potential || 0), 1), top = Math.ceil(max / 1e5) * 1e5, bw = (W - L - 8) / m.length;
    const y = (v) => H - B - (v / top) * (H - B - 10);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогноз продлений по месяцам">`;
    for (let i = 0; i <= 4; i++) { const v = top * i / 4; s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--faint)">${v ? Math.round(v / 1e3) + 'к' : '0'}</text>`; }
    m.forEach((x, i) => { const cx = L + i * bw + bw * .18, w = bw * .64, p = x.potential || 0, e = x.expected || 0;
      s += `<g class="cbar" data-tip="${esc(x.label)}: ожидаемо ${full(e) || '0 ₽'}, возможно ${full(p) || '0 ₽'}"><rect x="${L + i * bw}" y="0" width="${bw}" height="${H - B}" fill="transparent"/><rect x="${cx}" y="${y(p)}" width="${w}" height="${H - B - y(p)}" rx="3" fill="var(--accent-soft)"/><rect x="${cx}" y="${y(e)}" width="${w}" height="${H - B - y(e)}" rx="3" fill="var(--accent)"/><text x="${cx + w / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--faint)">${esc((x.label || '').slice(0, 3).toLowerCase())}</text></g>`; });
    return s + '</svg>';
  }

  let cur = -1;
  function render() {
    if (!D) return;
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const y = scrollY;
    $('#view').innerHTML = `<div class="wrap" style="max-width:none">${tab === 'utro' ? utro() : tab === 'money' ? moneyTab() : all()}</div>`;
    scrollTo(0, y);
    const qi = $('#q'); if (qi) qi.oninput = (e) => { q = e.target.value.toLowerCase().trim(); const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    $$('.cbar').forEach((g) => { g.onmouseenter = () => { const tp = $('#tip'), r = g.getBoundingClientRect(), cr = tp.parentElement.getBoundingClientRect(); tp.textContent = g.dataset.tip; tp.style.left = (r.left - cr.left + r.width / 2) + 'px'; tp.style.top = (r.top - cr.top + 40) + 'px'; tp.style.opacity = 1; }; g.onmouseleave = () => { $('#tip').style.opacity = 0; }; });
    swipes();
    const rs = $$('.rw .row'); if (cur >= rs.length) cur = rs.length - 1; if (cur >= 0 && rs[cur]) rs[cur].classList.add('cur');
  }
  function go(t, keep) { tab = t; if (!keep) { mf = ''; openB = ''; } cur = -1; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); scrollTo(0, 0); }

  // ---------- карточка дела ----------
  let dTask = null;
  function openTask(t) {
    dTask = t;
    $('#dc').textContent = t.cl; $('#dt').textContent = cap(t.title);
    const p = pend[t.id];
    $('#db').innerHTML = `<div class="meta">${duePill(t)}${t.a ? `<span class="pill p-acc num">${full(t.a)}</span>` : ''}${t.money ? `<span class="pill p-wait">${esc(t.money)}</span>` : ''}${av(t)}<span class="hint">${t.who === 'я' ? 'за вами' : 'ведёт ' + esc(t.who)}</span></div>
      ${t.detail ? `<div class="fact"><span class="k">Подробности</span><span>${esc(t.detail)}</span></div>` : ''}
      ${t.next ? `<div class="fact"><span class="k">Следующий шаг</span><span>${esc(t.next)}</span></div>` : ''}
      ${t.lastMove ? `<div class="fact"><span class="k">Последнее движение</span><span>${esc(t.lastMove)}</span></div>` : ''}
      <div class="fact"><span class="k">Откуда</span><span>${t.fromSummary ? 'Список «Нужно от вас» ветки «Утро и задачи»' : 'Завела ветка «' + esc(t.owner || 'Claude') + '»' + (t.added ? ', ' + esc(t.added) : '') + (t.section ? ' · ' + esc(t.section) : '')}</span></div>
      ${t.link ? `<a class="btn ghost small" href="${esc(t.link)}" target="_blank" rel="noopener">Открыть в портале</a>` : ''}
      <div class="acts" role="group" aria-label="Отметить">${['done', 'later', 'eve', 'prio', 'wait'].map((a) => `<button data-dact="${a}" aria-pressed="${!!(p && p.action === a)}">${LABEL[a]}</button>`).join('')}</div>
      <div class="ai"><label class="hint" for="aiText">Передать Claude: что сделать или что изменилось</label><textarea id="aiText" placeholder="Например: позвонила, оплатят в пятницу"></textarea><button class="btn small" data-dact="ai">Отправить</button></div>`;
    $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on');
  }
  function closeTask() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); dTask = null; }
  $('#dx').onclick = closeTask; $('#scrim').onclick = closeTask;

  // ---------- разбор утра ----------
  let fq = [], fi = 0, fres = {done: 0, later: 0, ai: 0, skip: 0};
  function startFocus() { fq = mine(); fi = 0; fres = {done: 0, later: 0, ai: 0, skip: 0}; $('#focus').hidden = false; document.body.style.overflow = 'hidden'; drawFocus(); }
  function endFocus() { $('#focus').hidden = true; document.body.style.overflow = ''; render(); }
  function drawFocus() {
    const f = $('#focus');
    if (fi >= fq.length) {
      f.innerHTML = `<div class="fcard"><div class="fbox" style="text-align:center;justify-items:center"><h2>Утро разобрано</h2><div class="d">Сделано ${fres.done}, отложено ${fres.later}, передано Claude ${fres.ai}${fres.skip ? ', пропущено ' + fres.skip : ''}.</div><button class="btn" data-fend>Вернуться к пульту</button></div></div>`; return;
    }
    const t = fq[fi];
    f.innerHTML = `<div class="fcard"><div class="fprog"><span class="num">${fi + 1} из ${fq.length}</span><span class="track"><span style="width:${fi / fq.length * 100}%"></span></span><button class="link" data-fend style="margin:0">Закончить <kbd>Esc</kbd></button></div>
      <div class="fbox"><div class="cl">${esc(t.cl)} ${duePill(t)} ${t.a ? `<span class="pill p-acc num">${full(t.a)}</span>` : ''}</div><h2>${esc(t.short)}</h2>
      <div class="d">${esc(t.fromSummary ? t.detail : t.next || t.detail || t.title)}</div>
      <div class="fbtns"><button class="done" data-f="done">Сделано <kbd>E</kbd></button><button data-f="later">Отложить <kbd>S</kbd></button><button data-f="ai">Передать Claude <kbd>A</kbd></button></div>
      <div id="fai" hidden><div class="ai" style="border:0;padding:0"><textarea id="faiText" placeholder="Что сделать Claude"></textarea><button class="btn small" data-f="aisend">Отправить <kbd style="background:transparent;color:inherit">Enter</kbd></button></div></div>
      <button class="link" data-f="skip" style="margin:0;justify-self:start">Пропустить →</button></div></div>`;
  }
  function focusAct(a) {
    const t = fq[fi]; if (!t) return;
    if (a === 'ai') { $('#fai').hidden = false; $('#faiText').focus(); return; }
    if (a === 'aisend') { const v = $('#faiText').value.trim(); if (!v) { $('#faiText').focus(); return; } act(t, 'ai', v); fres.ai++; }
    else if (a === 'skip') fres.skip++;
    else { act(t, a); fres[a]++; }
    fi++; drawFocus();
  }

  // ---------- свайпы на телефоне ----------
  function swipes() {
    $$('.rw').forEach((w) => {
      const r = $('.row', w); let x0 = null, dx = 0, y0 = 0;
      r.onpointerdown = (e) => { if (e.pointerType !== 'touch') return; x0 = e.clientX; y0 = e.clientY; dx = 0; };
      r.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(e.clientY - y0) > 30 && Math.abs(dx) < 30) { x0 = null; r.style.transform = ''; return; } if (Math.abs(dx) > 10) r.style.transform = `translateX(${dx}px)`; };
      r.onpointerup = r.onpointercancel = () => { if (x0 === null) return; x0 = null; r.style.transform = '';
        if (Math.abs(dx) > 90) { const t = T.find((x) => x.id === w.dataset.id); if (t) { r.classList.add('out'); setTimeout(() => act(t, dx > 0 ? 'done' : 'later'), 180); } } };
    });
  }

  // ---------- события ----------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-open]'); if (!b) return; const d = b.dataset;
    const w = b.closest('.rw'), t = w && T.find((x) => x.id === w.dataset.id);
    if (d.tab) go(d.tab);
    else if (d.focus !== undefined) startFocus();
    else if (d.fend !== undefined) endFocus();
    else if (d.f) focusAct(d.f);
    else if (d.act && t) { const rw = $('.row', w); rw.classList.add('out'); setTimeout(() => act(t, d.act), 180); }
    else if (d.open !== undefined && t) openTask(t);
    else if (d.dact && dTask) { if (d.dact === 'ai') { const v = $('#aiText').value.trim(); if (!v) { $('#aiText').focus(); return; } act(dTask, 'ai', v); $('#aiText').value = ''; } else { act(dTask, d.dact); closeTask(); } }
    else if (d.bucket) { openB = openB === d.bucket ? '' : d.bucket; render(); }
    else if (d.mf !== undefined) { mf = mf === d.mf ? '' : d.mf; if (d.go) go(d.go, true); else render(); }
    else if (d.go) { if (d.who) { who = d.who; sec = 'all'; } go(d.go); }
    else if (d.who) { who = d.who; render(); }
    else if (d.sec) { sec = d.sec; render(); }
    else if (d.g !== undefined) { openG.has(d.g) ? openG.delete(d.g) : openG.add(d.g); render(); }
  });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (!$('#focus').hidden) {
      if (e.key === 'Escape') return endFocus();
      if (typing) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); focusAct('aisend'); } return; }
      const k = {e: 'done', у: 'done', s: 'later', ы: 'later', a: 'ai', ф: 'ai', ArrowRight: 'skip'}[e.key]; if (k) { e.preventDefault(); focusAct(k); } return;
    }
    if (e.key === 'Escape') { if (dTask) closeTask(); else if (typing) document.activeElement.blur(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'л')) { e.preventDefault(); if (tab !== 'all') go('all'); $('#q').focus(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '/' || k === '.') { e.preventDefault(); if (tab !== 'all') go('all'); $('#q').focus(); return; }
    if ((k === 'r' || k === 'к') && tab === 'utro' && mine().length) { e.preventDefault(); return startFocus(); }
    const rs = $$('.rw'); if (!rs.length) return;
    if (k === 'j' || k === 'о' || k === 'arrowdown' && e.shiftKey) { cur = Math.min(rs.length - 1, cur + 1); }
    else if (k === 'k' || k === 'л') { cur = Math.max(0, cur - 1); }
    else if (cur >= 0 && rs[cur]) {
      const t = T.find((x) => x.id === rs[cur].dataset.id); if (!t) return;
      if (k === 'e' || k === 'у') act(t, 'done'); else if (k === 's' || k === 'ы') act(t, 'later'); else if (k === 'a' || k === 'ф') { openTask(t); setTimeout(() => $('#aiText').focus(), 300); } else if (k === 'enter') openTask(t); else return;
      e.preventDefault(); return;
    } else return;
    e.preventDefault(); $$('.row.cur').forEach((r) => r.classList.remove('cur')); const r = $('.row', rs[cur]); r.classList.add('cur'); r.scrollIntoView({block: 'nearest'});
  });
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['utro', 'money', 'all'].includes(h) && h !== tab) go(h); });

  async function load() {
    try {
      const res = await fetch('/data/svodka.json?t=' + Date.now(), {cache: 'no-store'});
      if (!res.ok) throw new Error('ответ ' + res.status);
      prep(await res.json());
      const h = location.hash.slice(1); tab = ['utro', 'money', 'all'].includes(h) ? h : 'utro';
      render(); if (outbox.length) flush();
    } catch (e) {
      $('#view').innerHTML = `<div class="empty"><b>Данные не загрузились</b><span>${esc(e.message)}. Обновите страницу; если не помогло, напишите ветке «Утро и задачи».</span><button class="btn small" onclick="location.reload()">Обновить</button></div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
