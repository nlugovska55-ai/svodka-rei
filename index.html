<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пульт РЭИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
<style>
/* Пульт «Утро»: шапка со свежестью данных → вкладки Утро / Деньги / Все дела → боковая карточка дела.
   Один язык статусов: срочность «сегодня / неделя / фон», красный только у «горит» (не больше трёх на экране). */
:root{
  /* Фирменный стиль rus-ei.ru (бренд-бриф 28.10.2026, утверждён 22.10): только светлая бело-зелёная тема */
  --bg:#F2F6EF; --surface:#FFFFFF; --sunk:#e4efdd; --soft:#F7FAF5; --ink:#243329; --muted:#59665D; --faint:#68756C; --line:#D5E3D0; --line2:#cfdcc8;
  --accent:#286534; --accent-h:#1f5229; --accent-soft:#e4efdd; --on-accent:#FFFFFF; --eyebrow:#397C4D;
  --hot:#c0392b; --hot-soft:#FBEAE8; --warn:#8A5A00; --warn-soft:#FBF1DE; --ok:#286534; --ok-soft:#e4efdd; --wait:#59665D; --wait-soft:#EEF3EB; --violet:#7C9384;
  --plus:#286534; --minus:#c0392b; --shadow:none;
  --f-body:"Open Sans","Segoe UI",Arial,sans-serif; --f-disp:"Exo 2","Open Sans","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
small{font-size:max(13px,.85em)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
/* шапка */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.brand{display:flex;gap:12px;align-items:center;min-width:0;text-decoration:none;color:inherit}
.brand img{height:44px;width:auto;display:block}
.brand .bt{display:grid;line-height:1.2}
.brand .bt b{font:700 18px var(--f-disp);color:var(--ink)}
.brand .bt span{font:600 13.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow)}
.seal{width:44px;height:44px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font:700 13px var(--f-disp)}
.tabs{display:flex;gap:4px}
.tab{border:0;border-bottom:3px solid transparent;background:transparent;border-radius:0;padding:10px 12px 7px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.fresh{margin-left:auto;font-size:13.5px;color:var(--faint);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:16px;height:16px}
/* утро */
.lead{display:grid;gap:14px;padding:6px 0 2px}
.lead h1{font:700 clamp(22px,3.2vw,32px)/1.25 var(--f-disp);max-width:34ch;color:var(--ink)}
.lead h1 em{font-style:normal;color:var(--accent)}
.lead .day,.eyebrow{font:600 13.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow)}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;min-height:50px;padding:0 22px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.hint{font-size:13.5px;color:var(--faint)}
kbd{font:11px var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--faint);background:var(--surface)}
.sec{display:grid;gap:10px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh h2{font:700 18px/1.3 var(--f-disp);color:var(--ink)}
.sh .c{color:var(--faint);font-size:14px}
.link{margin-left:auto;font-size:13.5px;color:var(--accent);background:none;border:0;padding:0}
/* строки */
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.rw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:14px;font-weight:600}
.rw .under .l{color:var(--ok)} .rw .under .r{color:var(--warn)}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;background:var(--surface);transition:background .12s,transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;touch-action:pan-y}
.row:hover,.row.cur{background:var(--sunk)}
.row.cur{box-shadow:inset 2px 0 0 var(--accent)}
.row.out{opacity:0;transform:translateX(30px)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;transition:all .15s}
.chk:hover{border-color:var(--ok);background:var(--ok-soft)}
.chk svg{width:12px;height:12px;opacity:0;color:var(--ok)}
.chk:hover svg,.chk.on svg{opacity:1}
.chk.on{border-color:var(--ok);background:var(--ok-soft)}
.hotdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-right:7px;vertical-align:2px}
.main-txt{border:0;background:none;padding:0;text-align:left;min-width:0;display:grid;gap:1px}
.main-txt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main-txt .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-hot{background:var(--hot-soft);color:var(--hot)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-wait{background:var(--wait-soft);color:var(--wait)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.sync{font-size:13.5px;color:var(--accent)}
.warnline{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font:700 17px var(--f-disp)}
.h1gap { display: block; font-size: 15px; font-weight: 500; margin-top: 6px; }
.jump { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px 16px; margin: 0 0 12px; font-size: 13px; }
.jump .link { margin: 0; padding: 2px 0; }
  .gap{border:1px solid var(--warn);border-left:6px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:16px 18px;display:grid;gap:8px;text-align:left}
.gap b{color:var(--ink);font:700 17px var(--f-disp)}
.gap .gap-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* денежная полоса */
.strip{display:grid;gap:8px}
.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunk)}
.pipe span{display:block;min-width:4px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stg{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);text-align:left;display:grid;gap:1px}
.stg:hover{border-color:var(--faint)}
.stg[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stg .k{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .v{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.stg .x{font-size:13.5px;color:var(--hot)}
/* корзины */
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bk{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;text-align:left;display:grid;gap:2px}
.bk:hover{border-color:var(--faint)}
.bk[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bk .n{font:700 22px var(--f-disp);color:var(--accent);font-variant-numeric:tabular-nums}
.bk .k{font-weight:500}
.bk .s{font-size:14px;color:var(--muted)}
/* все дела */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);flex:1 1 240px;max-width:360px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{display:grid;gap:0}
.gh{display:flex;gap:10px;align-items:baseline;padding:11px 14px;background:var(--surface);border:0;border-top:1px solid var(--line);font-weight:600;width:100%;text-align:left;min-width:0}
.gh:hover{background:var(--sunk)}
.gh .car{color:var(--faint);width:10px;flex:none}
.gh .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gh:first-child{border-top:0}
.gh .c{color:var(--faint);font-weight:400;font-size:14px}
.gh .am{margin-left:auto}
.gh+.rw{border-top:0}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:13.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.av.l{background:var(--warn-soft);color:var(--warn)} .av.c{background:var(--wait-soft);color:var(--wait)} .av.k{background:var(--ok-soft);color:var(--ok)}
/* деньги */
.money-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.chart{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);position:relative}
.chart svg{width:100%;height:auto;display:block}
.big{font:700 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13.5px}
.cap{font-size:13.5px;color:var(--faint);margin-top:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13.5px;padding:6px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.projects{display:grid;gap:6px}
.pj{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--muted)}
.pj b{color:var(--ink);font-weight:500}
/* боковая карточка */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;transform:translateX(102%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 20px}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dh .cl{font-size:14px;color:var(--muted)}
.dh h3{font:700 19px/1.3 var(--f-disp);margin-top:2px}
.dbody{overflow:auto;display:grid;gap:14px;margin-top:14px;align-content:start;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fact{display:grid;gap:2px;font-size:14px}
.fact .k{font-size:13.5px;color:var(--faint)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13.5px}
.acts button:hover{border-color:var(--faint)}
.acts button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.ai{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ai textarea{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:76px;background:var(--bg);resize:vertical}
/* разбор утра */
.ab{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink);white-space:nowrap;flex:none}
.ab svg{width:12px;height:12px}
.ab.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.ab.ok:hover{background:var(--ok-soft)}
.ab.cl{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.abs{display:flex;gap:6px;flex:none}
@media (max-width:480px){.abs{flex-direction:column;gap:4px}.ab{height:26px;padding:0 7px;font-size:13.5px}}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.42);display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.sh-in{width:min(520px,100%);background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{align-items:center}.sh-in{border-radius:16px}}
.sh-in textarea{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:64px;background:var(--bg)}
.sh-b{display:flex;gap:8px;flex-wrap:wrap}
.jr{display:grid;gap:6px}
.jl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.jl:first-child{border-top:0}
.st{font-size:13.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.st.acc{background:var(--accent-soft,var(--sunk));color:var(--accent)}
.st.app{background:var(--ok-soft);color:var(--ok)}
.st.err{background:var(--warn-soft);color:var(--warn)}
.cal{display:grid;gap:2px}
.cd{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.cd:first-child{border-top:0}
.cd .dt{color:var(--muted);font-variant-numeric:tabular-nums}
.cd .wt{min-width:0;overflow-wrap:anywhere}
.cd .wt small{display:block;color:var(--muted);font-size:13.5px}
.kd{font-size:13.5px;padding:1px 7px;border-radius:99px;margin-right:6px;background:var(--sunk);color:var(--muted)}
.kd.pay{background:var(--warn-soft);color:var(--warn)}
.kd.in{background:var(--ok-soft);color:var(--ok)}
.kd.ref{background:transparent;border:1px dashed var(--line)}
.kd.task{background:var(--sunk);color:var(--ink)}
.kd{white-space:nowrap}
@media (max-width:480px){.cd{grid-template-columns:40px minmax(0,1fr) auto;gap:8px;font-size:13.5px}.cd .dt{font-size:13.5px}}
.src-l{display:grid;gap:4px;font-size:14px}
.src-l span.no{color:var(--warn)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pf>div{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.pf b{font:700 18px/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.pf small{color:var(--muted);font-size:13.5px}
details.bs summary{cursor:pointer;font-weight:500;padding:6px 0}
details.bs ul{margin:0 0 6px 18px;display:grid;gap:3px;font-size:13.5px}
.focus{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fcard{width:min(620px,100%);display:grid;gap:18px}
.fprog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.fprog .track{flex:1;height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fprog .track span{display:block;height:100%;background:var(--accent);transition:width .3s}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fbox .cl{color:var(--muted);font-size:14px}
.fbox h2{font:700 22px/1.3 var(--f-disp)}
.fbox .d{color:var(--muted)}
.fbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbtns button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:2px;justify-items:center;font-weight:600;min-height:44px}
.fbtns button:hover{border-color:var(--faint)}
.fbtns button.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.fbtns kbd{background:transparent;color:inherit;opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);visibility:hidden;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:40;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;font-size:14px;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{background:none;border:0;color:var(--surface);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--muted)}
.skel{height:120px;border-radius:10px;background:var(--sunk)}
/* первый экран: охват, три приоритета, план недели, банк */
.cover{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--eyebrow);border-radius:8px;padding:12px 14px;font-size:14.5px}
.cover b{font-variant-numeric:tabular-nums}
.cover .link{margin-left:auto;white-space:nowrap}
.rows.prio{border:0;background:transparent;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:visible}
.rows.prio.n1{grid-template-columns:minmax(0,1fr)}.rows.prio.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rw.pc{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rw.pc:first-child{border-top:1px solid var(--line)}
.rw.pc.hot{border-top:4px solid var(--hot)}
.pc .row{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;padding:14px 16px 16px;height:100%}
.pc .pn{display:flex;gap:10px;align-items:center}

  let wsel = '';

      const unk = a.filter((i) => i.a === null).length;

      <div class="wl" style="cursor:default"><span>Остаток на конец недели</span><span class="r na">не считаю</span></div></div>`;
    let det = '';

    const late = G ? G.filter((r) => garOpen(r) && garKind(r) !== 'no' && r.date && r.date < W[0].s) : [], noDate = G ? G.filter((r) => garOpen(r) && garKind(r) !== 'no' && !r.date) : [];

  // Точность прогноза: только по прогнозу, сохранённому в понедельник недели, и оплатам из банка по тем же ID

  // Продления и ИК: контроль сроков, в прогноз денег не входят (прогноз денег — только таблица Лены)
  function fsaHTML() {

      s += `<g class="cbar" data-tip="${esc(x.label)}: ожидаемо ${full(e) || '0 ₽'}, возможно ${full(p) || '0 ₽'}"><rect x="${L + i * bw}" y="0" width="${bw}" height="${H - B}" fill="transparent"/><rect x="${cx}" y="${y(p)}" width="${w}" height="${H - B - y(p)}" rx="3" fill="var(--accent-soft)"/><rect x="${cx}" y="${y(e)}" width="${w}" height="${H - B - y(e)}" rx="3" fill="var(--accent)"/><text x="${cx + w / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--faint)">${esc((x.label || '').slice(0, 3).toLowerCase())}</text></g>`; });
    return s + '</svg>';
  }

  let cur = -1;
  function render() {
    if (!D) return;
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const y = scrollY;
    $('#view').innerHTML = `<div class="wrap" style="max-width:none">${tab === 'utro' ? utro() : tab === 'money' ? moneyTab() : tab === 'buh' ? buhTab() : all()}</div>`;
    scrollTo(0, y);
    const qi = $('#q'); if (qi) qi.oninput = (e) => { q = e.target.value.toLowerCase().trim(); const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    $$('.cbar').forEach((g) => { g.onmouseenter = () => { const tp = $('#tip'), r = g.getBoundingClientRect(), cr = tp.parentElement.getBoundingClientRect(); tp.textContent = g.dataset.tip; tp.style.left = (r.left - cr.left + r.width / 2) + 'px'; tp.style.top = (r.top - cr.top + 40) + 'px'; tp.style.opacity = 1; }; g.onmouseleave = () => { $('#tip').style.opacity = 0; }; });
    swipes();
    const rs = $$('.rw .row'); if (cur >= rs.length) cur = rs.length - 1; if (cur >= 0 && rs[cur]) rs[cur].classList.add('cur');
  }
  function go(t, keep) { tab = t; if (!keep) { mf = ''; openB = ''; } cur = -1; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); scrollTo(0, 0); }

  // ---------- карточка дела ----------
  let dTask = null;
  function openTask(t) {
    dTask = t;
    $('#dc').textContent = t.cl; $('#dt').textContent = cap(t.title);
    const p = pend[t.id];
    $('#db').innerHTML = `<div class="meta">${duePill(t)}${t.a ? `<span class="pill p-acc num">${full(t.a)}</span>` : ''}${t.refA ? `<span class="hint">справочно ${full(t.refA)}${t.amountNote ? ': ' + esc(t.amountNote.slice(0, 160)) : ''}</span>` : ''}${t.money ? `<span class="pill p-wait">${esc(t.money)}</span>` : ''}${av(t)}<span class="hint">${t.who === 'я' ? 'за вами' : 'ведёт ' + esc(t.who)}</span></div>
      ${t.detail ? `<div class="fact"><span class="k">Подробности</span><span>${esc(t.detail)}</span></div>` : ''}
      ${t.next ? `<div class="fact"><span class="k">Следующий шаг</span><span>${esc(t.next)}</span></div>` : ''}
      ${t.lastMove ? `<div class="fact"><span class="k">Последнее движение</span><span>${esc(t.lastMove)}</span></div>` : ''}
      ${(t.steps || []).length ? `<div class="fact"><span class="k">Подпункты сверки</span><span><ol style="margin:0;padding-left:18px">${t.steps.map((x) => `<li>${x.done ? '✓ ' : ''}${esc(x.text || '')}${x.criterion ? `<br><small class="na">критерий: ${esc(x.criterion)}${x.src ? ' · источник: ' + esc(x.src) : ''}</small>` : ''}${x.result ? `<br><small>итог: ${esc(x.result)}</small>` : ''}</li>`).join('')}</ol></span></div>` : ''}
      <div class="fact"><span class="k">Проверка по источнику</span><span>${t.checked ? esc(t.checked) : 'не сверено'}${t.src ? ' · источник: ' + esc(t.src) : ' · источник не указан'}${t.thread || t.origin ? ' · ветка: ' + esc(t.thread || t.origin) : ''}${t.verified ? '' : ' — сегодня не сверено, в «Требует вашего решения» не попадает'}</span></div>
      <div class="fact"><span class="k">Откуда</span><span>${t.fromSummary ? 'Список «Нужно от вас» ветки «Утро и задачи»' : 'Завела ветка «' + esc(t.owner || 'Claude') + '»' + (t.added ? ', ' + esc(t.added) : '') + (t.section ? ' · ' + esc(t.section) : '')}</span></div>
      ${(t.orders || []).length > 1 ? `<div class="fact"><span class="k">Заказы на портале</span><span>${t.orders.map((o) => `<a href="http://95.84.156.117:3839/projects/orders/${esc(o)}/" target="_blank" rel="noopener">${esc(o)}</a>`).join(' · ')}</span></div>` : ''}
      ${!t.link && /портал/i.test([t.title, t.detail, t.next].join(' ')) ? `<div class="fact"><span class="k">Портал</span><span style="color:var(--warn)">номер заказа в деле не указан — ссылку даст ветка «${esc(t.owner || 'Браузер')}»</span></div>` : ''}
      ${t.link ? `<a class="btn ghost small" href="${esc(t.link)}" target="_blank" rel="noopener">${/95\.84\.156\.117|\/orders\//.test(t.link) ? 'Открыть заказ в портале' : 'Открыть источник'}</a>` : ''}
      <div class="acts" role="group" aria-label="Отметить">${['done', 'claude', 'later', 'eve', 'prio', 'wait'].map((a) => `<button data-dact="${a}" aria-pressed="${!!(p && p.action === a)}">${LABEL[a]}</button>`).join('')}</div>
      <div class="ai"><label class="hint" for="aiText">Передать Claude: что сделать или что изменилось</label><textarea id="aiText" placeholder="Например: позвонила, оплатят в пятницу"></textarea><button class="btn small" data-dact="ai">Отправить</button></div>`;
    draftFill($('#aiText'), String(t.id));
    $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on');
  }
  function closeTask() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); dTask = null; }
  $('#dx').onclick = closeTask; $('#scrim').onclick = closeTask;

  // ---------- разбор утра ----------
  let fq = [], fi = 0, fres = {done: 0, later: 0, ai: 0, skip: 0};
  function startFocus() { fq = mine(); fi = 0; fres = {done: 0, later: 0, ai: 0, skip: 0}; $('#focus').hidden = false; document.body.style.overflow = 'hidden'; drawFocus(); }
  function endFocus() { $('#focus').hidden = true; document.body.style.overflow = ''; render(); }
  function drawFocus() {
    const f = $('#focus');
    if (fi >= fq.length) {
      f.innerHTML = `<div class="fcard"><div class="fbox" style="text-align:center;justify-items:center"><h2>Утро разобрано</h2><div class="d">Сделано ${fres.done}, отложено ${fres.later}, передано Claude ${fres.ai}${fres.skip ? ', пропущено ' + fres.skip : ''}.</div><button class="btn" data-fend>Вернуться к пульту</button></div></div>`; return;
    }
    const t = fq[fi];
    f.innerHTML = `<div class="fcard"><div class="fprog"><span class="num">${fi + 1} из ${fq.length}</span><span class="track"><span style="width:${fi / fq.length * 100}%"></span></span><button class="link" data-fend style="margin:0">Закончить <kbd>Esc</kbd></button></div>
      <div class="fbox"><div class="cl">${esc(t.cl)} ${duePill(t)} ${t.a ? `<span class="pill p-acc num">${full(t.a)}</span>` : ''}</div><h2>${esc(t.short)}</h2>
      <div class="d">${esc(t.fromSummary ? t.detail : t.next || t.detail || t.title)}</div>
      <div class="fbtns"><button class="done" data-f="done">Я выполнила <kbd>E</kbd></button><button data-f="later">Отложить <kbd>S</kbd></button><button data-f="claude">Поручить Claude <kbd>A</kbd></button></div>
      <div id="fai" hidden><div class="ai" style="border:0;padding:0"><textarea id="faiText" placeholder="Что сделать Claude"></textarea><button class="btn small" data-f="aisend">Отправить <kbd style="background:transparent;color:inherit">Enter</kbd></button></div></div>
      <button class="link" data-f="skip" style="margin:0;justify-self:start">Пропустить →</button></div></div>`;
    draftFill($('#faiText'), String(t.id)); if (drafts[String(t.id)]) $('#fai').hidden = false;
  }
  function focusAct(a) {
    const t = fq[fi]; if (!t) return;
    if (a === 'ai') { $('#fai').hidden = false; $('#faiText').focus(); return; }
    if (a === 'done') return confirmDone(t, (how) => { fres[how === 'claude' ? 'ai' : 'done']++; fi++; drawFocus(); });
    if (a === 'claude') return delegate(t, () => { fres.ai++; fi++; drawFocus(); });
    if (a === 'aisend') { const v = $('#faiText').value.trim(); if (!v) { $('#faiText').focus(); return; } act(t, 'ai', v); fres.ai++; }
    else if (a === 'skip') fres.skip++;
    else { act(t, a); fres[a]++; }
    fi++; drawFocus();
  }

  // ---------- свайпы на телефоне ----------
  function swipes() {
    $$('.rw').forEach((w) => {
      const r = $('.row', w); if (!r) return; let x0 = null, dx = 0, y0 = 0;
      r.onpointerdown = (e) => { if (e.pointerType !== 'touch') return; x0 = e.clientX; y0 = e.clientY; dx = 0; };
      r.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(e.clientY - y0) > 30 && Math.abs(dx) < 30) { x0 = null; r.style.transform = ''; return; } if (Math.abs(dx) > 10) r.style.transform = `translateX(${dx}px)`; };
      r.onpointerup = r.onpointercancel = () => { if (x0 === null) return; x0 = null; r.style.transform = '';
        if (Math.abs(dx) > 90) { const t = T.find((x) => x.id === w.dataset.id); if (t) { r.classList.add('out'); setTimeout(() => { r.classList.remove('out'); dx > 0 ? confirmDone(t) : act(t, 'later'); }, 180); } } };
    });
  }

  // ---------- события ----------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-open]'); if (!b) return; const d = b.dataset;
    const w = b.closest('.rw'), t = w && T.find((x) => x.id === w.dataset.id);
    if (d.tab) go(d.tab);
    else if (d.gapclaude !== undefined) { const ids = T.filter((x) => !x.fromSummary && !okToday(x.checked)).map((x) => x.id);
      act({id: 'sum-gap', cl: 'Пульт', title: 'Сверить с источником дела без сегодняшней сверки', short: 'Сверить ' + ids.length + ' непроверенных дел'}, 'ai',
        'Сверить с источником сегодня и поставить checked/src (или «не найдено в источнике»): ' + ids.join(', ')); }
    else if (d.focus !== undefined) startFocus();
    else if (d.fend !== undefined) endFocus();
    else if (d.f) focusAct(d.f);
    else if (d.sh) { const cb = sheetCb; if (d.sh !== 'no' && cb) cb(d.sh); if (sheetCb === cb) closeSheet(); }
    else if (d.act === 'done' && t) confirmDone(t);
    else if (d.act === 'claude' && t) delegate(t);
    else if (d.undo) undoJournal(d.undo);
    else if (d.cal) { calN = +d.cal; render(); }
    else if (d.more) { EXP.has(d.more) ? EXP.delete(d.more) : EXP.add(d.more); render(); }
    else if (d.wsel) { wsel = wsel === d.wsel ? '' : d.wsel; render(); }
    else if (d.act && t) { const rw = $('.row', w); rw.classList.add('out'); setTimeout(() => act(t, d.act), 180); }
    else if (d.open !== undefined && t) openTask(t);
    else if (d.wk) { const x = T.find((y) => y.id === d.wk); if (x) openTask(x); }
    else if (d.dact && dTask) { const t0 = dTask; if (d.dact === 'ai') { const v = $('#aiText').value.trim(); if (!v) { $('#aiText').focus(); return; } act(t0, 'ai', v); $('#aiText').value = ''; } else if (d.dact === 'done') { closeTask(); confirmDone(t0); } else if (d.dact === 'claude') { closeTask(); delegate(t0); } else { act(t0, d.dact); closeTask(); } }
    else if (d.portion !== undefined) { portion = (portion + 1) * PORTION >= mine().length ? 0 : portion + 1; render(); }
    else if (d.retry !== undefined) flush();
    else if (d.bucket) { openB = openB === d.bucket ? '' : d.bucket; render(); }
    else if (d.mf !== undefined) { mf = mf === d.mf ? '' : d.mf; if (d.go) go(d.go, true); else render(); }
    else if (d.go && d.anchor) { go(d.go); setTimeout(() => { const el = document.getElementById(d.anchor); if (el) el.scrollIntoView({block: 'start'}); }, 30); }
    else if (d.go) { if (d.who) { who = d.who; sec = 'all'; q = ''; } if (d.sec) { sec = d.sec; who = 'all'; q = ''; } go(d.go); }
    else if (d.who) { who = d.who; render(); }
    else if (d.sec) { sec = d.sec; render(); }
    else if (d.g !== undefined) { openG.has(d.g) ? openG.delete(d.g) : openG.add(d.g); render(); }
  });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (!$('#sheet').hidden && $('#focus').hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (!$('#focus').hidden) {
      if (e.key === 'Escape') return endFocus();
      if (typing) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); focusAct('aisend'); } return; }
      if (!$('#sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
      const k = {e: 'done', у: 'done', s: 'later', ы: 'later', a: 'claude', ф: 'claude', ArrowRight: 'skip'}[e.key]; if (k) { e.preventDefault(); focusAct(k); } return;
    }
    if (e.key === 'Escape') { if (dTask) closeTask(); else if (typing) document.activeElement.blur(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'л')) { e.preventDefault(); if (tab !== 'all') go('all'); $('#q').focus(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '/' || k === '.') { e.preventDefault(); if (tab !== 'all') go('all'); $('#q').focus(); return; }
    if ((k === 'r' || k === 'к') && tab === 'utro' && mine().length) { e.preventDefault(); return startFocus(); }
    const rs = $$('.rw'); if (!rs.length) return;
    if (k === 'j' || k === 'о' || k === 'arrowdown' && e.shiftKey) { cur = Math.min(rs.length - 1, cur + 1); }
    else if (k === 'k' || k === 'л') { cur = Math.max(0, cur - 1); }
    else if (cur >= 0 && rs[cur]) {
      const t = T.find((x) => x.id === rs[cur].dataset.id); if (!t) return;
      if (k === 'e' || k === 'у') confirmDone(t); else if (k === 's' || k === 'ы') act(t, 'later'); else if (k === 'a' || k === 'ф') { openTask(t); setTimeout(() => $('#aiText').focus(), 300); } else if (k === 'enter') openTask(t); else return;
      e.preventDefault(); return;
    } else return;
    e.preventDefault(); $$('.row.cur').forEach((r) => r.classList.remove('cur')); const r = $('.row', rs[cur]); r.classList.add('cur'); r.scrollIntoView({block: 'nearest'});
  });
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['utro', 'money', 'buh', 'all'].includes(h) && h !== tab) go(h); });

  // Отметки с других устройств: читаем ветку inbox за 48 ч, пока Claude их не внёс в базу
  let syncNote = '';
  async function pull() {
    try {
      const all = []; let cursor = '', complete = false;
      for (let i = 0; i < 50; i++) {
        const res = await fetch('/api/comments' + (cursor ? '?cursor=' + encodeURIComponent(cursor) : ''), {cache: 'no-store'});
        const j = await res.json().catch(() => ({}));
        if (!res.ok || !j.ok) throw new Error(j.error || ('ответ ' + res.status));
        all.push(...(j.items || []));
        if (!j.nextCursor) { complete = true; break; }
        cursor = j.nextCursor;
      }
      if (!complete) throw new Error('список отметок неполный');
      // старые отметки без id события (до 28.10) — по времени сборки, остальные — пока разбор не подтвердил их id
      const since = Date.parse(D.updated);
      const open = all.filter((x) => x.taskId && (x.eid ? !APPLIED.has(x.eid) : Date.parse(x.at) > since));
      for (const x of open.sort((a, b) => Date.parse(a.at) - Date.parse(b.at))) {
        const cur = pend[x.taskId], ts = Date.parse(x.at);
        if (cur && cur.eid === x.eid) continue;
        if (cur && !cur.remote && cur.ts > ts) continue;  // своя более поздняя отметка важнее
        if (x.action === 'reopen') delete pend[x.taskId];
        else if (['done', 'later', 'wait', 'eve', 'prio', 'claude'].includes(x.action)) pend[x.taskId] = {action: x.action, ts, eid: x.eid || '', remote: true};
        if (x.eid && !journal.some((j) => j.eid === x.eid)) { const t = T.find((y) => y.id === x.taskId); journal.push({eid: x.eid, taskId: x.taskId, short: t ? t.short : x.taskId, action: x.action, at: x.at, state: 'remote'}); }
      }
      journal.sort((a, b) => Date.parse(a.at) - Date.parse(b.at)); jsave();
      store.set('svodka-pending', pend); syncNote = '';
    } catch (e) { syncNote = 'отметки с других устройств не загрузились: ' + e.message; }
    if (syncNote) $('#fresh').insertAdjacentHTML('beforeend', `<span class="sync" title="${esc(syncNote)}" style="color:var(--warn)"> · ${esc(syncNote)}</span>`);
  }
  async function load(refresh = false) {
    tick(); loadedAt = Date.now();
    try {
      const res = await fetch('/data/svodka.json?t=' + Date.now(), {cache: 'no-store'});
      if (!res.ok) throw new Error('ответ ' + res.status);
      const data = await res.json();
      // открытая карточка, черновик, разбор по одному или окно «Отменить» — не перерисовываем, повторим позже
      if (refresh && busy()) { setTimeout(() => load(true), 30e3); return; }
      prep(data);
      await pull();
      if (!refresh) { const h = location.hash.slice(1); tab = ['utro', 'money', 'buh', 'all'].includes(h) ? h : 'utro'; }
      render(); if (outbox.length || inflight) flush();
    } catch (e) {
      if (refresh && D) { $('#fresh').insertAdjacentHTML('beforeend', `<span class="sync" style="color:var(--warn)"> · обновить не удалось (${esc(e.message)}), показаны данные прошлой загрузки</span>`); return; }
      $('#view').innerHTML = `<div class="empty"><b>Данные не загрузились</b><span>${esc(e.message)}. Обновите страницу; если не помогло, напишите ветке «Утро и задачи».</span><button class="btn small" onclick="location.reload()">Обновить</button></div>`;
    }
  }
  let loadedAt = 0;
  const busy = () => !!undo || $('#drawer').classList.contains('on') || !$('#focus').hidden || !$('#sheet').hidden
    || (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))
    || [...document.querySelectorAll('textarea')].some((x) => x.value.trim());
  load();
  // автообновление: каждые 10 минут, при возврате на вкладку (если прошло больше минуты) и при смене московской даты
  const REFRESH = 10 * 6e4;
  setInterval(() => { if (document.visibilityState === 'visible') load(true); }, REFRESH);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - loadedAt > 6e4) load(true); });
  let day = mskYmd(Date.now());
  setInterval(() => { const d = mskYmd(Date.now()); if (d !== day) { day = d; load(true); } }, 6e4);
  window.__svodkaRefresh = () => load(true);  // для тестов
})();
</script>
